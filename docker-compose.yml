services:
  postgres:
    image: postgres:16-alpine
    container_name: xuguang-postgres
    environment:
      POSTGRES_USER: xuguang
      POSTGRES_PASSWORD: xuguang
      POSTGRES_DB: xuguang
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U xuguang -d xuguang']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: xuguang-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
