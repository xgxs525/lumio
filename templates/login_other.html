<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>序办扫码登录 - 序办</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            color: #162033;
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .page {
            min-height: 100vh;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 36vw;
        }

        .main {
            position: relative;
            padding: 26px 34px;
            display: grid;
            grid-template-rows: auto 1fr auto;
            min-width: 0;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: #111827;
            text-decoration: none;
            font-size: 24px;
            font-weight: 900;
        }

        .brand-mark {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, #20dfc8 0 45%, #2563eb 46% 100%);
            position: relative;
            box-shadow: 0 12px 26px rgba(37, 99, 235, 0.18);
        }

        .brand-mark::after {
            content: "";
            position: absolute;
            left: 9px;
            top: 9px;
            width: 18px;
            height: 10px;
            border-left: 5px solid #ffffff;
            border-bottom: 5px solid #ffffff;
            transform: rotate(-45deg);
            border-radius: 2px;
        }

        .login-wrap {
            display: grid;
            place-items: center;
            padding: 40px 0;
        }

        .login-card {
            width: min(540px, 100%);
            min-height: 660px;
            padding: 72px 64px 44px;
            border-radius: 8px;
            background: #ffffff;
            border: 1px solid #dfe6ef;
            box-shadow: 0 24px 68px rgba(16, 32, 51, 0.12);
            text-align: center;
        }

        .login-card h1 {
            margin-bottom: 12px;
            font-size: 28px;
            letter-spacing: 0;
        }

        .login-card p {
            color: #64748b;
            line-height: 1.7;
            font-size: 16px;
        }

        .qr {
            position: relative;
            width: 228px;
            height: 228px;
            margin: 42px auto 28px;
            padding: 18px;
            border-radius: 8px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 12px 32px rgba(16, 32, 51, 0.08);
        }

        .qr-grid {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(13, 1fr);
            grid-template-rows: repeat(13, 1fr);
            gap: 3px;
        }

        .qr-grid span {
            border-radius: 2px;
            background: #111827;
        }

        .qr-grid span:nth-child(2n),
        .qr-grid span:nth-child(5n),
        .qr-grid span:nth-child(7n) { opacity: 0; }

        .qr-grid span:nth-child(1),
        .qr-grid span:nth-child(2),
        .qr-grid span:nth-child(3),
        .qr-grid span:nth-child(14),
        .qr-grid span:nth-child(27),
        .qr-grid span:nth-child(157),
        .qr-grid span:nth-child(158),
        .qr-grid span:nth-child(159) { opacity: 1; }

        .switch-link,
        .register-line a,
        .language {
            color: #2563eb;
            text-decoration: none;
            font-weight: 800;
        }

        .switch-link {
            display: inline-flex;
            margin-top: 8px;
        }

        .register-line {
            margin-top: 170px;
            color: #64748b;
            font-size: 15px;
        }

        .footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            color: #64748b;
            font-size: 14px;
        }

        .side {
            position: relative;
            overflow: hidden;
            display: grid;
            place-items: center;
            padding: 44px;
            background:
                radial-gradient(circle at 78% 16%, rgba(168, 85, 247, 0.15), transparent 32%),
                linear-gradient(180deg, #edf3ff 0%, #f6f8ff 100%);
        }

        .illustration {
            width: min(430px, 100%);
            text-align: center;
        }

        .shape-scene {
            position: relative;
            height: 330px;
            margin-bottom: 34px;
        }

        .house {
            position: absolute;
            left: 50%;
            bottom: 24px;
            width: 240px;
            height: 190px;
            transform: translateX(-50%);
            border: 2px solid rgba(255, 255, 255, 0.86);
            border-top: 0;
            background: rgba(255, 255, 255, 0.32);
        }

        .house::before {
            content: "";
            position: absolute;
            left: 31px;
            top: -72px;
            width: 174px;
            height: 174px;
            border-left: 2px solid rgba(255, 255, 255, 0.86);
            border-top: 2px solid rgba(255, 255, 255, 0.86);
            transform: rotate(45deg);
            background: rgba(255, 255, 255, 0.22);
        }

        .block {
            position: absolute;
            border-radius: 0;
            background: #c7ccd3;
        }

        .block.one { left: 78px; bottom: 34px; width: 104px; height: 34px; background: #bdd1ff; }
        .block.two { left: 110px; bottom: 68px; width: 76px; height: 48px; background: #bdd1ff; }
        .block.three { left: 180px; bottom: 34px; width: 94px; height: 100px; }
        .block.four { left: 252px; bottom: 34px; width: 104px; height: 92px; background: #dde1e7; }

        .circle {
            position: absolute;
            border-radius: 999px;
            background: #ffb11a;
        }

        .circle.orange { right: 110px; bottom: 152px; width: 76px; height: 92px; }
        .circle.orange-small { right: 126px; bottom: 246px; width: 42px; height: 42px; }
        .circle.blue { left: 126px; bottom: 118px; width: 32px; height: 32px; background: #2563eb; }
        .circle.gray { right: 38px; bottom: 90px; width: 110px; height: 228px; background: #c9ced5; opacity: 0.85; }

        .side h2 {
            margin-bottom: 14px;
            font-size: 28px;
        }

        .side p {
            color: #64748b;
            font-size: 17px;
        }

        @media (max-width: 980px) {
            .page { grid-template-columns: 1fr; }
            .side { display: none; }
            .login-card { min-height: auto; padding: 48px 28px 34px; }
            .register-line { margin-top: 80px; }
        }
    

        /* Platform navigation */
        .logo-mark {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
            padding: 6px;
            background: linear-gradient(135deg, #1cf0ca, #2684ff);
            box-shadow: 0 0 24px rgba(34, 244, 220, 0.24);
        }
        .logo-mark span { border-radius: 2px; background: rgba(255, 255, 255, 0.82); }
        .nav-links { align-items: center !important; }
        .mega-nav-item { position: relative !important; }
        .mega-dropdown {
            left: 50% !important;
            width: min(780px, calc(100vw - 48px)) !important;
            min-width: min(560px, calc(100vw - 48px)) !important;
            transform: translateX(-50%) !important;
            grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
            gap: 10px !important;
            padding: 12px !important;
            list-style: none !important;
        }
        .nav-item.has-dropdown:hover .mega-dropdown,
        .nav-item.has-dropdown.open .mega-dropdown { display: grid !important; }
        .mega-dropdown.right-align {
            left: auto !important;
            right: 0 !important;
            transform: none !important;
        }
        .mega-dropdown .mega-card {
            display: grid !important;
            gap: 6px !important;
            min-height: 86px;
            padding: 14px !important;
            border: 1px solid rgba(120, 168, 255, 0.18) !important;
            border-radius: 8px !important;
            background: rgba(255, 255, 255, 0.04) !important;
            text-decoration: none !important;
        }
        .mega-dropdown .mega-card strong { color: inherit; font-size: 15px; line-height: 1.35; }
        .mega-dropdown .mega-card span { color: #607086; font-size: 13px; line-height: 1.55; font-weight: 600; }
        .mega-dropdown .mega-card:hover { border-color: rgba(15, 118, 110, 0.36) !important; background: #eef8f6 !important; }
        body .nav-item > a.nav-cta {
            color: #061026 !important;
            background: linear-gradient(135deg, #7ffcef, #3b8cff) !important;
            box-shadow: 0 10px 24px rgba(37, 99, 235, 0.18) !important;
        }
        body .nav-item > a.nav-workbench {
            color: #0f766e !important;
            border: 1px solid rgba(15, 118, 110, 0.28) !important;
            background: #eef8f6 !important;
        }
        .workspace-nav-item { display: none !important; }
        .workspace-nav-item.is-visible { display: block !important; }
        @media (max-width: 900px) {
            .mega-dropdown,
            .mega-dropdown.right-align {
                left: 0 !important;
                right: auto !important;
                width: min(620px, calc(100vw - 28px)) !important;
                min-width: 0 !important;
                transform: none !important;
                grid-template-columns: 1fr !important;
            }
        }

    

        /* Stable SaaS mega menu overlay */
        body .dropdown.mega-dropdown {
            position: absolute !important;
            top: calc(100% + 10px) !important;
            width: min(940px, calc(100vw - 48px)) !important;
            min-width: min(680px, calc(100vw - 48px)) !important;
            max-height: calc(100vh - 118px) !important;
            overflow-y: auto !important;
            overscroll-behavior: contain !important;
            grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
            gap: 10px !important;
            padding: 14px !important;
            border: 1px solid #d8e3f2 !important;
            border-radius: 12px !important;
            color: #172033 !important;
            background: rgba(255, 255, 255, 0.98) !important;
            box-shadow: 0 24px 70px rgba(15, 23, 42, 0.22) !important;
            backdrop-filter: blur(14px);
        }
        body .dropdown.mega-dropdown::-webkit-scrollbar { width: 8px; }
        body .dropdown.mega-dropdown::-webkit-scrollbar-thumb { background: #c5d3e4; border-radius: 999px; }
        body .nav-item.has-dropdown:hover .mega-dropdown,
        body .nav-item.has-dropdown.open .mega-dropdown { display: grid !important; }
        body .dropdown.mega-dropdown .mega-card {
            display: grid !important;
            align-content: start !important;
            gap: 7px !important;
            min-height: 96px !important;
            padding: 15px !important;
            border: 1px solid #dde8f5 !important;
            border-radius: 10px !important;
            color: #172033 !important;
            background: #f8fbff !important;
            text-decoration: none !important;
            opacity: 1 !important;
        }
        body .dropdown.mega-dropdown .mega-card strong {
            display: block !important;
            color: #0b1b33 !important;
            font-size: 16px !important;
            font-weight: 900 !important;
            line-height: 1.35 !important;
        }
        body .dropdown.mega-dropdown .mega-card span {
            display: block !important;
            color: #5d6d82 !important;
            font-size: 13px !important;
            font-weight: 700 !important;
            line-height: 1.55 !important;
        }
        body .dropdown.mega-dropdown .mega-card:hover {
            border-color: rgba(15, 118, 110, 0.35) !important;
            background: #edf8f6 !important;
            transform: translateY(-1px);
        }
        @media (max-width: 1020px) {
            body .dropdown.mega-dropdown {
                width: min(680px, calc(100vw - 28px)) !important;
                min-width: 0 !important;
                grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
            }
        }
        @media (max-width: 700px) {
            body .dropdown.mega-dropdown {
                left: 0 !important;
                right: auto !important;
                transform: none !important;
                grid-template-columns: 1fr !important;
            }
        }

    

        /* Mega menu hover bridge: keep dropdown selectable */
        .mega-nav-item::after {
            content: "";
            position: absolute;
            left: -18px;
            right: -18px;
            top: 100%;
            height: 18px;
            pointer-events: auto;
        }
        body .dropdown.mega-dropdown {
            top: calc(100% + 2px) !important;
            z-index: 30000 !important;
        }
        .nav-item.has-dropdown.is-hovering > .mega-dropdown,
        .nav-item.has-dropdown.open > .mega-dropdown {
            display: grid !important;
        }

    

        /* Clickable brand logo */
        .logo { cursor: pointer; }

    

        /* AI office platform menu polish */
        body .dropdown.mega-dropdown .mega-group-title {
            grid-column: 1 / -1;
            padding: 8px 4px 2px;
            color: #145ee8;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 0.02em;
        }
        .account-menu-divider {
            height: 1px;
            margin: 8px 0;
            background: #e8eef6;
        }


        /* Account flyout viewport guard */
        .account-dropdown { overflow: visible !important; }
        .account-submenu.account-submenu-anchored {
            position: fixed !important;
            right: auto !important;
            margin-right: 0 !important;
            width: min(340px, calc(100vw - 24px)) !important;
            max-height: calc(100vh - 24px) !important;
            overflow-y: auto !important;
            z-index: 50000 !important;
        }
        .appearance-submenu.account-submenu-anchored {
            width: min(260px, calc(100vw - 24px)) !important;
        }
        .switch-account-submenu.account-submenu-anchored {
            width: min(360px, calc(100vw - 24px)) !important;
        }
        .account-menu-section.is-open > .account-submenu.account-submenu-anchored,
        .account-menu-section:hover > .account-submenu.account-submenu-anchored {
            display: grid !important;
            gap: 4px !important;
        }

    </style>
</head>
<body>
    <div class="page">
        <main class="main">
            <a class="brand" href="/login">
                <span class="brand-mark" aria-hidden="true"></span>
                序办
            </a>

            <section class="login-wrap">
                <div class="login-card">
                    <h1>扫码登录</h1>
                    <p>请使用序办移动端扫描二维码</p>
                    <div class="qr" aria-label="序办扫码登录二维码">
                        <div class="qr-grid" aria-hidden="true">
                            {% for i in range(169) %}<span></span>{% endfor %}
                        </div>
                    </div>
                    <a class="switch-link" href="/login">切换到账号登录</a>
                    <div class="register-line">还没有账号？ <a href="/register">立即注册</a></div>
                </div>
            </section>

            <div class="footer-row">
                <a class="language" href="/login/more">简体中文 ▾</a>
                <span>序办账号体系</span>
            </div>
        </main>

        <aside class="side">
            <div class="illustration">
                <div class="shape-scene">
                    <div class="house"></div>
                    <div class="circle gray"></div>
                    <div class="circle orange"></div>
                    <div class="circle orange-small"></div>
                    <div class="circle blue"></div>
                    <div class="block one"></div>
                    <div class="block two"></div>
                    <div class="block three"></div>
                    <div class="block four"></div>
                </div>
                <h2>先接入团队，再用序办</h2>
                <p>企业级 AI 办公与数据协作平台</p>
            </div>
        </aside>
    </div>

    <script>
        (() => {
            if (window.__excelLoginGuardReady) return;
            window.__excelLoginGuardReady = true;

            function isLoggedIn() {
                return localStorage.getItem('excel_toolbox_logged_in') === '1';
            }

            function currentPath() {
                return `${window.location.pathname}${window.location.search}${window.location.hash}` || '/';
            }

            function normalizeNext(next) {
                if (!next || next === '#' || next.startsWith('javascript:')) return currentPath();
                try {
                    const url = new URL(next, window.location.origin);
                    if (url.origin !== window.location.origin) return currentPath();
                    return `${url.pathname}${url.search}${url.hash}` || '/';
                } catch (error) {
                    return currentPath();
                }
            }

            function redirectToLogin(next) {
                const target = normalizeNext(next);
                localStorage.setItem('excel_toolbox_login_redirect', target);
                window.location.href = `/login?next=${encodeURIComponent(target)}`;
            }

            window.isExcelLoggedIn = isLoggedIn;
            window.requireLogin = function requireLogin(next) {
                if (isLoggedIn()) return true;
                redirectToLogin(next);
                return false;
            };

            const protectedApiPrefixes = [
                '/api/upload',
                '/api/preview',
                '/api/split',
                '/api/columns',
                '/api/user/templates',
                '/api/user/files',
                '/api/user/history',
                '/api/user/info',
                '/api/task',
                '/api/download'
            ];

            if (window.fetch && !window.__excelFetchGuarded) {
                window.__excelFetchGuarded = true;
                const originalFetch = window.fetch.bind(window);
                window.fetch = (input, init) => {
                    const rawUrl = typeof input === 'string' ? input : input.url;
                    const url = new URL(rawUrl, window.location.origin);
                    const isProtectedApi = protectedApiPrefixes.some(prefix => url.pathname.startsWith(prefix));
                    if (isProtectedApi && !isLoggedIn()) {
                        redirectToLogin(currentPath());
                        return Promise.reject(new Error('请先登录后再操作'));
                    }
                    return originalFetch(input, init);
                };
            }

            document.addEventListener('click', event => {
                const target = event.target.closest('[data-requires-login]');
                if (!target) return;
                const next = target.getAttribute('href') || target.dataset.loginNext || currentPath();
                if (!window.requireLogin(next)) {
                    event.preventDefault();
                    event.stopImmediatePropagation();
                }
            }, true);
        })();
    </script>



    <script>
        (() => {
            if (window.__platformDropdownWheelReady) return;
            window.__platformDropdownWheelReady = true;
            function bindWheelGuards() {
                document.querySelectorAll('.mega-dropdown, .account-dropdown, .account-submenu').forEach(panel => {
                    if (panel.dataset.wheelGuardReady === '1') return;
                    panel.dataset.wheelGuardReady = '1';
                    panel.addEventListener('wheel', event => {
                        const canScroll = panel.scrollHeight > panel.clientHeight;
                        if (!canScroll) {
                            event.preventDefault();
                            event.stopPropagation();
                            return;
                        }
                        const atTop = panel.scrollTop <= 0 && event.deltaY < 0;
                        const atBottom = Math.ceil(panel.scrollTop + panel.clientHeight) >= panel.scrollHeight && event.deltaY > 0;
                        if (atTop || atBottom) event.preventDefault();
                        event.stopPropagation();
                    }, { passive: false });
                });
            }
            bindWheelGuards();
            document.addEventListener('mouseover', bindWheelGuards, { passive: true });
        })();
    </script>



    <script>
        (() => {
            if (window.__megaDropdownSelectableReady) return;
            window.__megaDropdownSelectableReady = true;
            document.querySelectorAll('.mega-nav-item').forEach(item => {
                let timer;
                const open = () => {
                    clearTimeout(timer);
                    document.querySelectorAll('.mega-nav-item.is-hovering').forEach(other => {
                        if (other !== item) other.classList.remove('is-hovering');
                    });
                    item.classList.add('is-hovering');
                };
                const close = () => {
                    clearTimeout(timer);
                    timer = setTimeout(() => item.classList.remove('is-hovering'), 180);
                };
                item.addEventListener('mouseenter', open);
                item.addEventListener('mouseleave', close);
                const panel = item.querySelector('.mega-dropdown');
                if (panel) {
                    panel.addEventListener('mouseenter', open);
                    panel.addEventListener('mouseleave', close);
                    panel.addEventListener('click', event => event.stopPropagation());
                }
            });
        })();
    </script>



    <script>
        (() => {
            if (window.__brandHomeLinkReady) return;
            window.__brandHomeLinkReady = true;
            document.querySelectorAll('.logo').forEach(logo => {
                logo.setAttribute('role', 'link');
                logo.setAttribute('tabindex', '0');
                logo.setAttribute('aria-label', '????');
                logo.addEventListener('click', () => { window.location.href = '/'; });
                logo.addEventListener('keydown', event => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        window.location.href = '/';
                    }
                });
            });
        })();
    </script>


    <script>
        (() => {
            if (window.__accountFlyoutClampReady) return;
            window.__accountFlyoutClampReady = true;

            const margin = 12;
            const gap = 10;

            function positionSubmenu(section) {
                const submenu = section.querySelector('.account-submenu');
                const trigger = section.querySelector('.account-panel-trigger');
                if (!submenu || !trigger) return;

                submenu.classList.add('account-submenu-anchored');
                const previousVisibility = submenu.style.visibility;
                const previousDisplay = submenu.style.display;
                submenu.style.visibility = 'hidden';
                submenu.style.display = 'grid';

                const triggerRect = trigger.getBoundingClientRect();
                const submenuRect = submenu.getBoundingClientRect();
                let left = triggerRect.left - submenuRect.width - gap;
                if (left < margin) left = triggerRect.right + gap;
                if (left + submenuRect.width > window.innerWidth - margin) {
                    left = window.innerWidth - submenuRect.width - margin;
                }
                left = Math.max(margin, left);

                let top = triggerRect.top;
                if (top + submenuRect.height > window.innerHeight - margin) {
                    top = window.innerHeight - submenuRect.height - margin;
                }
                top = Math.max(margin, top);

                submenu.style.left = `${Math.round(left)}px`;
                submenu.style.top = `${Math.round(top)}px`;
                submenu.style.visibility = previousVisibility;
                submenu.style.display = previousDisplay;
            }

            function openSection(section) {
                const dropdown = section.closest('.account-dropdown');
                if (dropdown) {
                    dropdown.querySelectorAll('.account-menu-section.is-open').forEach(item => {
                        if (item !== section) item.classList.remove('is-open');
                    });
                }
                section.classList.add('is-open');
                requestAnimationFrame(() => positionSubmenu(section));
            }

            function bindAccountFlyouts() {
                document.querySelectorAll('.account-menu-section').forEach(section => {
                    if (section.dataset.flyoutClampReady === '1') return;
                    section.dataset.flyoutClampReady = '1';
                    section.addEventListener('mouseenter', () => openSection(section));
                    section.addEventListener('focusin', () => openSection(section));
                    const trigger = section.querySelector('.account-panel-trigger');
                    if (trigger) {
                        trigger.addEventListener('click', event => {
                            event.preventDefault();
                            event.stopPropagation();
                            openSection(section);
                        });
                    }
                });
            }

            window.addEventListener('resize', () => {
                document.querySelectorAll('.account-menu-section.is-open').forEach(positionSubmenu);
            });
            window.addEventListener('scroll', () => {
                document.querySelectorAll('.account-menu-section.is-open').forEach(positionSubmenu);
            }, true);
            bindAccountFlyouts();
            document.addEventListener('mouseover', bindAccountFlyouts, { passive: true });
        })();
    </script>

</body>
</html>
